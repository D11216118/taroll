<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塔羅抽一張</title>
    <style>
        /* ===== 全域樣式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        /* ===== 標題區 ===== */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #4a5568;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #718096;
            font-size: 1em;
        }

        /* ===== 輸入區 ===== */
        .input-section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #4a5568;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        /* ===== 按鈕區 ===== */
        .button-section {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            flex: 1;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-draw {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-draw:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-clear {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-clear:hover {
            background: #cbd5e0;
        }

        /* ===== 結果區 ===== */
        .result-section {
            display: none;
            background: linear-gradient(135deg, #f6f8fb 0%, #e9ecef 100%);
            border-radius: 15px;
            padding: 30px;
            animation: fadeIn 0.5s;
        }

        .result-section.show {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .timestamp {
            color: #718096;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .question-display {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .question-label {
            color: #718096;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .question-text {
            color: #4a5568;
            font-size: 1em;
            font-style: italic;
        }

        .card-result {
            text-align: center;
            margin-bottom: 20px;
        }

        .card-name {
            font-size: 2em;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .orientation {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 1em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .orientation.upright {
            background: #48bb78;
            color: white;
        }

        .orientation.reversed {
            background: #f56565;
            color: white;
        }

        .interpretation {
            background: white;
            padding: 20px;
            border-radius: 10px;
            line-height: 1.8;
            color: #4a5568;
            font-size: 1.05em;
        }

        /* ===== 錯誤訊息 ===== */
        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* ===== 響應式設計 ===== */
        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
            }

            .card-name {
                font-size: 1.5em;
            }

            .button-section {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 標題區 -->
        <div class="header">
            <h1>🔮 塔羅抽一張</h1>
            <p class="subtitle">讓塔羅牌為你的問題帶來啟發</p>
        </div>

        <!-- 輸入區 -->
        <div class="input-section">
            <label for="questionInput">你的問題（選填）</label>
            <textarea 
                id="questionInput" 
                placeholder="輸入你想詢問的問題，或留空進行每日抽牌..."
            ></textarea>
        </div>

        <!-- 按鈕區 -->
        <div class="button-section">
            <button class="btn-draw" onclick="drawCard()">抽牌</button>
            <button class="btn-clear" onclick="clearAll()">清除</button>
        </div>

        <!-- 結果區 -->
        <div id="resultSection" class="result-section">
            <div class="timestamp" id="timestamp"></div>
            
            <div class="question-display" id="questionDisplay">
                <div class="question-label">你的問題</div>
                <div class="question-text" id="questionText"></div>
            </div>

            <div class="card-result">
                <div class="card-name" id="cardName"></div>
                <span class="orientation" id="orientation"></span>
            </div>

            <div class="interpretation" id="interpretation"></div>
        </div>

        <!-- 錯誤訊息 -->
        <div id="errorMessage" class="error-message"></div>
    </div>

        // ===== 核心函數 =====

        /**
         * 隨機整數生成器
         * @param {number} max - 最大值（不含）
         * @returns {number} 0 到 max-1 之間的隨機整數
         */
        function randomInt(max) {
            return Math.floor(Math.random() * max);
        }

        /**
         * 抽牌主函數
         */
        function drawCard() {
            try {
                // 檢查牌庫是否存在
                if (!TAROT_CARDS || TAROT_CARDS.length === 0) {
                    showError("牌庫資料缺失，請檢查程式碼。");
                    return;
                }

                // 隱藏錯誤訊息
                hideError();

                // 隨機選擇一張牌
                const card = TAROT_CARDS[randomInt(TAROT_CARDS.length)];

                // 隨機決定正位或逆位（50/50）
                const isUpright = Math.random() < 0.5;
                const orientation = isUpright ? "upright" : "reversed";

                // 取得問題
                const questionInput = document.getElementById('questionInput');
                const question = questionInput.value.trim();

                // 建立抽牌結果物件
                const reading = {
                    timestamp: new Date(),
                    question: question || null,
                    card: card,
                    orientation: orientation,
                    interpretation: isUpright ? card.upright : card.reversed
                };

                // 渲染結果
                renderReading(reading);

            } catch (error) {
                console.error("抽牌過程發生錯誤:", error);
                showError("抽牌過程發生錯誤，請重試。");
            }
        }

        /**
         * 渲染抽牌結果
         * @param {Object} reading - 抽牌結果物件
         */
        function renderReading(reading) {
            // 格式化時間
            const timeString = reading.timestamp.toLocaleString('zh-TW', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            // 更新時間戳記
            document.getElementById('timestamp').textContent = `抽牌時間：${timeString}`;

            // 更新問題顯示
            const questionDisplay = document.getElementById('questionDisplay');
            const questionText = document.getElementById('questionText');
            if (reading.question) {
                questionDisplay.style.display = 'block';
                questionText.textContent = reading.question;
            } else {
                questionDisplay.style.display = 'none';
            }

            // 更新牌名
            document.getElementById('cardName').textContent = reading.card.name;

            // 更新正逆位標籤
            const orientationElement = document.getElementById('orientation');
            orientationElement.textContent = reading.orientation === 'upright' ? '正位' : '逆位';
            orientationElement.className = `orientation ${reading.orientation}`;

            // 更新解讀文字
            document.getElementById('interpretation').textContent = reading.interpretation;

            // 顯示結果區
            const resultSection = document.getElementById('resultSection');
            resultSection.classList.add('show');

            // 滾動到結果區
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        /**
         * 清除所有內容
         */
        function clearAll() {
            // 清空問題輸入
            document.getElementById('questionInput').value = '';

            // 隱藏結果區
            const resultSection = document.getElementById('resultSection');
            resultSection.classList.remove('show');

            // 隱藏錯誤訊息
            hideError();
        }

        /**
         * 顯示錯誤訊息
         * @param {string} message - 錯誤訊息文字
         */
        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.classList.add('show');
        }

        /**
         * 隱藏錯誤訊息
         */
        function hideError() {
            const errorElement = document.getElementById('errorMessage');
            errorElement.classList.remove('show');
        }

        // ===== DOM 載入完成後的初始化 =====
        document.addEventListener('DOMContentLoaded', function() {
            console.log('塔羅抽一張已載入');
            console.log(`牌庫包含 ${TAROT_CARDS.length} 張牌`);

            // 驗證牌庫完整性
            if (TAROT_CARDS.length !== 78) {
                console.warn(`警告：牌庫應包含 78 張牌，目前有 ${TAROT_CARDS.length} 張`);
            }

            // 可選：Enter 鍵觸發抽牌
            document.getElementById('questionInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    drawCard();
                }
            });
        });
